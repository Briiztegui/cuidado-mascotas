<!-- 
  VISTA CLIENTE: Panel de Solicitudes Realizadas y Reseñas (Integrantes 6 y 7)
  - Listado de solicitudes enviadas por el cliente con su estado actual (pendiente, aceptada, rechazada, completada) (Int. 6).
  - Botón directo a WhatsApp visible SOLO si el estado es 'aceptada' (Int. 6).
  - Botón/formulario para dejar reseña de 1 a 5 estrellas visible SOLO si el estado es 'completada' (Int. 7).
-->
<!-- 
    VISTA OFERENTE: Panel de Control Principal (Integrantes 4, 6 y 7)
    - Sección 1 (Integrante 4): Formulario para cargar servicios y listado de servicios propios.
    - Sección 2 (Integrante 6): Listado de solicitudes recibidas con botones para aceptar, rechazar o marcar como completada (+ badge de nuevas).
    - Sección 3 (Integrante 7): Resumen de estadísticas (cantidad de servicios, solicitudes por estado, promedio) y reseñas recibidas.
-->
