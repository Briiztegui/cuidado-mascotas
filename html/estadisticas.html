<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Estadísticas | Huellitas</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="../css/estilo.css">
        <link rel="stylesheet" href="../css/resenas.css">
        <link rel="stylesheet" href="../css/estadisticas.css">
    </head>
    <body class="bg-light">
        <header id="navbarContainer"></header>

        <main class="container py-5">
            <div class="card card-resena shadow-sm mx-auto" style="max-width: 600px;">
            <div class="card-body">
                <h1 class="h3 titulo">Tus estadísticas</h1>

                <div class="row row-cols-2 row-cols-md-3 g-3 mt-1 text-center">
                <div class="col"><div class="card card-stat p-3 h-100"><span class="stat-numero" id="statServicios">0</span><p class="mb-0 stat-label">Servicios</p></div></div>
                <div class="col"><div class="card card-stat p-3 h-100"><span class="stat-numero" id="statPendiente">0</span><p class="mb-0 stat-label">Pendientes</p></div></div>
                <div class="col"><div class="card card-stat p-3 h-100"><span class="stat-numero" id="statAceptada">0</span><p class="mb-0 stat-label">Aceptadas</p></div></div>
                <div class="col"><div class="card card-stat p-3 h-100"><span class="stat-numero" id="statRechazada">0</span><p class="mb-0 stat-label">Rechazadas</p></div></div>
                <div class="col"><div class="card card-stat p-3 h-100"><span class="stat-numero" id="statCompletada">0</span><p class="mb-0 stat-label">Completadas</p></div></div>
                <div class="col"><div class="card card-stat p-3 h-100"><span class="stat-numero" id="statPromedio">0</span><p class="mb-0 stat-label">Promedio ⭐</p></div></div>
                </div>

                <p id="mensajeStats" class="mt-3 text-danger"></p>
            </div>
            </div>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script type="module" src="../js/auth-guard.js"></script>
        <script type="module" src="../js/estadisticas.js"></script>
    </body>
</html>
