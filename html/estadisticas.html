<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estadísticas</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/resenas.css">
  <link rel="stylesheet" href="../css/estadisticas.css">
</head>
<body>

    <h1>Tus estadísticas</h1>

    <div class="grilla-stats">
      <div class="stat"><span id="statServicios">0</span><p>Servicios</p></div>
      <div class="stat"><span id="statPendiente">0</span><p>Pendientes</p></div>
      <div class="stat"><span id="statAceptada">0</span><p>Aceptadas</p></div>
      <div class="stat"><span id="statRechazada">0</span><p>Rechazadas</p></div>
      <div class="stat"><span id="statCompletada">0</span><p>Completadas</p></div>
      <div class="stat"><span id="statPromedio">0</span><p>Promedio ⭐</p></div>
    </div>

    <p id="mensajeStats"></p>
  </div>

  <script type="module" src="../js/estadisticas.js"></script>

</html>
