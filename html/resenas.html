<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Reseñas | Huellitas</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="../css/resenas.css">
    </head>
    <body class="bg-light">
        <header id="navbarContainer"></header>

        <main class="container py-5">
            <div class="card card-resena shadow-sm mx-auto" style="max-width: 500px;">
            <div class="card-body">
                <div class="d-flex align-items-center justify-content-between gap-2 mb-3">
                <h1 class="h3 titulo mb-0">Dejá tu reseña</h1>
                <a href="mis-solicitudes.html" class="btn btn-outline-secondary btn-sm rounded-pill">
                    Volver
                </a>
                </div>

                <form id="formResena" novalidate>
                <!-- Las estrellas van de 5 a 1 a propósito (el CSS las da vuelta) -->
                <div class="estrellas mb-3" role="radiogroup" aria-label="Puntaje de 1 a 5 estrellas">
                    <input type="radio" name="puntaje" id="e5" value="5"><label for="e5" title="5 estrellas">★</label>
                    <input type="radio" name="puntaje" id="e4" value="4"><label for="e4" title="4 estrellas">★</label>
                    <input type="radio" name="puntaje" id="e3" value="3"><label for="e3" title="3 estrellas">★</label>
                    <input type="radio" name="puntaje" id="e2" value="2"><label for="e2" title="2 estrellas">★</label>
                    <input type="radio" name="puntaje" id="e1" value="1"><label for="e1" title="1 estrella">★</label>
                </div>

                <div class="mb-3">
                    <label for="comentario" class="form-label">Comentario</label>
                    <textarea id="comentario" class="form-control" rows="4" placeholder="Contanos tu experiencia"></textarea>
                </div>

                <button id="btnEnviar" type="submit" class="btn btn-mascotas rounded-pill px-4">Enviar</button>
                </form>

                <p id="mensaje" class="mt-3 mb-0 fw-bold"></p>
            </div>
            </div>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script type="module" src="../js/auth-guard.js"></script>
        <script type="module" src="../js/resenas-stats.js"></script>
    </body>
</html>
