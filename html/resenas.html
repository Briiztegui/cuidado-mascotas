<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reseñas</title>
  <!-- Bootstrap y las fuentes del grupo -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/resenas.css">
</head>
<body class="container py-5">
  <div class="card shadow-sm mx-auto" style="max-width: 500px;">
    <div class="card-body">
      <h1 class="h3 titulo">Dejá tu reseña</h1>

      <!-- Las estrellas van de 5 a 1 a propósito (el CSS las da vuelta) -->
      <div class="estrellas mb-3">
        <input type="radio" name="puntaje" id="e5" value="5"><label for="e5">★</label>
        <input type="radio" name="puntaje" id="e4" value="4"><label for="e4">★</label>
        <input type="radio" name="puntaje" id="e3" value="3"><label for="e3">★</label>
        <input type="radio" name="puntaje" id="e2" value="2"><label for="e2">★</label>
        <input type="radio" name="puntaje" id="e1" value="1"><label for="e1">★</label>
      </div>

      <textarea id="comentario" class="form-control mb-3" rows="4" placeholder="Contanos tu experiencia"></textarea>
      <button id="btnEnviar" class="btn btn-mascotas">Enviar</button>
      <p id="mensaje" class="mt-3 fw-bold"></p>
    </div>
  </div>

  <script type="module" src="../js/resenas-stats.js"></script>
</body>
</html>
