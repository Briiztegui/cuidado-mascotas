<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel del Oferente - Cuidado de Mascotas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <main class="container py-4">
    <h1 class="mb-4">Panel del Profesional</h1>

    <!-- Sección 1 (Integrante 4): Formulario para cargar servicios y listado de servicios propios. -->
    <section id="seccion-servicios" class="mb-5"></section>

    <!-- Sección 2 (Integrante 6): Listado de solicitudes recibidas con botones para aceptar, rechazar o marcar como completada (+ badge de nuevas). -->
    <section id="seccion-solicitudes" class="mb-5"></section>

    <!-- Sección 3 (Integrante 7): Resumen de estadísticas (cantidad de servicios, solicitudes por estado, promedio) y reseñas recibidas. -->
    <section id="seccion-estadisticas-resenas" class="mb-5">
      <h2 class="h4 mb-3">Mis Estadísticas y Reseñas</h2>

      <div id="alertaStats" class="alert alert-warning d-none" role="alert"></div>

      <!-- Tarjetas con los números del oferente -->
      <div class="row g-3 mb-4">
        <div class="col-md-4">
          <div class="card shadow-sm h-100 text-center">
            <div class="card-body">
              <h6 class="text-muted text-uppercase small">Servicios Activos</h6>
              <p id="statServicios" class="display-6 fw-bold mb-0">0</p>
            </div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card shadow-sm h-100 text-center">
            <div class="card-body">
              <h6 class="text-muted text-uppercase small">Calificación Promedio</h6>
              <p id="statPromedio" class="display-6 fw-bold text-warning mb-0">0.0 ★</p>
            </div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card shadow-sm h-100">
            <div class="card-body">
              <h6 class="text-muted text-uppercase small text-center mb-3">Solicitudes por Estado</h6>
              <ul class="list-group list-group-flush small">
                <li class="list-group-item d-flex justify-content-between px-0 py-1">
                  <span>Pendientes</span>
                  <span id="statPendientes" class="badge bg-secondary rounded-pill">0</span>
                </li>
                <li class="list-group-item d-flex justify-content-between px-0 py-1">
                  <span>Aceptadas</span>
                  <span id="statAceptadas" class="badge bg-primary rounded-pill">0</span>
                </li>
                <li class="list-group-item d-flex justify-content-between px-0 py-1">
                  <span>Completadas</span>
                  <span id="statCompletadas" class="badge bg-success rounded-pill">0</span>
                </li>
                <li class="list-group-item d-flex justify-content-between px-0 py-1">
                  <span>Rechazadas</span>
                  <span id="statRechazadas" class="badge bg-danger rounded-pill">0</span>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>

      <!-- Lista de reseñas que le dejaron al profesional -->
      <div class="card shadow-sm">
        <div class="card-header bg-white fw-semibold">
          Reseñas Recibidas
        </div>
        <div id="listaResenasOferente" class="card-body">
          <p class="text-muted mb-0">Cargando reseñas...</p>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="../js/resenas-stats.js"></script>
</body>
</html>
