<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Solicitudes recibidas | Huellitas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/estilo.css" />
    <link rel="stylesheet" href="../css/solicitud.css" />
  </head>
  <body class="bg-light">
    <header id="navbarContainer"></header>

    <main class="container py-4">
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
        <div class="d-flex align-items-center gap-2">
          <h1 class="h3 fw-bold mb-0">Solicitudes recibidas</h1>
          <span id="badgeSolicitudesNuevas" class="badge rounded-pill text-bg-warning">0</span>
        </div>
        <div class="d-flex flex-wrap gap-2">
          <a href="panel-oferente.html" class="btn btn-outline-secondary btn-sm rounded-pill">
            Volver al panel
          </a>
          <a href="perfil-oferente.html" class="btn btn-outline-primary btn-sm rounded-pill">
            Mi perfil
          </a>
        </div>
      </div>

      <!-- Filtro rápido por estado -->
      <div class="d-flex flex-wrap gap-2 mb-3" role="group" aria-label="Filtrar solicitudes por estado">
        <button type="button" class="btn btn-sm btn-dark rounded-pill filtro-estado" data-estado="todas">
          Todas
        </button>
        <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill filtro-estado" data-estado="pendiente">
          Pendientes
        </button>
        <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill filtro-estado" data-estado="aceptada">
          Aceptadas
        </button>
        <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill filtro-estado" data-estado="completada">
          Completadas
        </button>
        <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill filtro-estado" data-estado="rechazada">
          Rechazadas
        </button>
      </div>

      <div id="alertaSolicitudesOferente" class="mb-3"></div>
      <div id="contenedorSolicitudesOferente" class="row g-3">
        <p class="text-secondary">Cargando solicitudes recibidas...</p>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/auth-guard.js"></script>
    <script type="module" src="../js/solicitudOferente.js"></script>
  </body>
</html>
